# ==============================================================================
# Portfolio Cloudflare Worker Configuration (wrangler.toml)
#
# POC / Implementation Architecture:
# - Serves static assets directly from the `dist` directory via Cloudflare's high-speed edge network.
# - Binds to custom domain `akib35.dev` with zero server computation cost.
# - Uses assets-only Worker with minimal entry point for pure static hosting.
# ==============================================================================

name = "portfolio"
compatibility_date = "2026-03-13"
main = "dist/index.js"

routes = [
  { pattern = "akib35.dev", custom_domain = true }
]

[assets]
directory = "dist"
