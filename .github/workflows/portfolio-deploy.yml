# For more details, see docs/portfolio/implementation-notes.md#github-workflows-portfolio-deploy-yml-note-1.

name: Deploy Portfolio (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/portfolio/**"
      - ".github/workflows/portfolio-deploy.yml"
  workflow_dispatch:

concurrency:
  group: portfolio-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy portfolio
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: portfolio

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node runs `astro build` (bun only installs/launches it). Astro 7.4.2+
      # needs Node >=22.23.4, so CI pins the major from .node-version (24 LTS)
      # instead of trusting the runner image's preinstalled Node.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portfolio
        run: bun --filter portfolio build

      - name: Ensure Pages project exists
        working-directory: apps/portfolio
        run: |
          if bunx wrangler pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Pages project '$PROJECT_NAME' exists"
          else
            bunx wrangler pages project create "$PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: apps/portfolio
        run: |
          bunx wrangler pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="$(git log -1 --pretty=%s | head -c 200)"
