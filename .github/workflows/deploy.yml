# ==============================================================================
# Cloudflare Multi-Target Production Deployment Workflow
#
# Documentation & Implementation POC:
# - Purpose: Edge deployment for Akiblog monorepo (Blog SSR Worker & Portfolio static site).
# - Triggers: 
#     1) Push to 'main': automatically deploys all components.
#     2) 'workflow_dispatch': allows targeted redeployment (all, blog, or portfolio)
#        and optional skipping of D1 database migrations via UI toggle.
# - Performance & Reliability:
#     - Designed for Alpine Linux runners (1GB RAM) using pre-packaged dist.tar.gz archives.
#     - Completely avoids runner OOM crashes by bypassing Node compilation on CI.
#     - Applies idempotent D1 schema migrations before activating edge Worker routes.
# ==============================================================================

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (all, blog, portfolio)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - blog
          - portfolio
      apply_migrations:
        description: 'Apply pending D1 migrations (blog)'
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    name: Deploy Edge Applications
    runs-on: alpine-latest
    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cloudflare Wrangler
        run: |
          npm install -g wrangler@4.131.1

      # ------------------------------------------------------------------------
      # BLOG DEPLOYMENT
      # ------------------------------------------------------------------------
      - name: Extract Blog Artifacts
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "blog" ]; then
            cd apps/blog
            if [ -f "dist.tar.gz" ]; then
              tar -xzf dist.tar.gz
              echo "✅ Extracted apps/blog/dist.tar.gz"
            else
              echo "⚠️ apps/blog/dist.tar.gz not found, relying on existing dist/"
            fi
          else
            echo "⏭️ Skipping Blog artifact extraction (Target: $TARGET)"
          fi

      - name: Configure Blog Environment Variables
        env:
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_TEAM_DOMAIN: ${{ secrets.CLOUDFLARE_TEAM_DOMAIN }}
          CLOUDFLARE_ACCESS_AUD: ${{ secrets.CLOUDFLARE_ACCESS_AUD }}
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "blog" ]; then
            cd apps/blog
            # Inject D1 Database ID
            if [ -n "$CLOUDFLARE_DATABASE_ID" ]; then
              sed -i "s/blog-db-local-id/$CLOUDFLARE_DATABASE_ID/g" wrangler.toml
              if [ -f "dist/server/wrangler.json" ]; then
                sed -i "s/blog-db-local-id/$CLOUDFLARE_DATABASE_ID/g" dist/server/wrangler.json
              fi
              echo "✅ Injected CLOUDFLARE_DATABASE_ID"
            fi
            # Inject Cloudflare Access Zero Trust config
            if [ -n "$CLOUDFLARE_TEAM_DOMAIN" ]; then
              sed -i "s/placeholder-team-domain/$CLOUDFLARE_TEAM_DOMAIN/g" wrangler.toml
              if [ -f "dist/server/wrangler.json" ]; then
                sed -i "s/placeholder-team-domain/$CLOUDFLARE_TEAM_DOMAIN/g" dist/server/wrangler.json
              fi
              echo "✅ Injected CLOUDFLARE_TEAM_DOMAIN"
            fi
            if [ -n "$CLOUDFLARE_ACCESS_AUD" ]; then
              sed -i "s/placeholder-aud-tag/$CLOUDFLARE_ACCESS_AUD/g" wrangler.toml
              if [ -f "dist/server/wrangler.json" ]; then
                sed -i "s/placeholder-aud-tag/$CLOUDFLARE_ACCESS_AUD/g" dist/server/wrangler.json
              fi
              echo "✅ Injected CLOUDFLARE_ACCESS_AUD"
            fi
          fi

      - name: Apply Pending Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          APPLY_MIG="${{ inputs.apply_migrations }}"
          [ -z "$APPLY_MIG" ] && APPLY_MIG="true"

          if ([ "$TARGET" = "all" ] || [ "$TARGET" = "blog" ]) && [ "$APPLY_MIG" != "false" ]; then
            cd apps/blog
            echo "🚀 Applying pending migrations to blog-db..."
            for migration in ../../packages/db/migrations/*.sql; do
              if [ -f "$migration" ]; then
                echo "Applying migration: $migration"
                wrangler d1 execute blog-db --remote --file="$migration"
              fi
            done
            echo "✅ All database migrations applied"
          else
            echo "⏭️ Skipping database migrations (Target: $TARGET, Apply: $APPLY_MIG)"
          fi

      - name: Deploy Blog Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "blog" ]; then
            cd apps/blog
            echo "🚀 Deploying Blog SSR Worker..."
            if [ -f "dist/server/wrangler.json" ]; then
              wrangler deploy --config dist/server/wrangler.json
            else
              wrangler deploy
            fi
            echo "✅ Blog SSR Worker deployed"
          else
            echo "⏭️ Skipping Blog deploy (Target: $TARGET)"
          fi

      # ------------------------------------------------------------------------
      # PORTFOLIO DEPLOYMENT
      # ------------------------------------------------------------------------
      - name: Extract Portfolio Artifacts
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "portfolio" ]; then
            if [ -d "apps/portfolio" ]; then
              cd apps/portfolio
              if [ -f "dist.tar.gz" ]; then
                tar -xzf dist.tar.gz
                echo "✅ Extracted apps/portfolio/dist.tar.gz"
              fi
            fi
          else
            echo "⏭️ Skipping Portfolio artifact extraction (Target: $TARGET)"
          fi

      - name: Deploy Portfolio to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "portfolio" ]; then
            if [ -d "apps/portfolio" ]; then
              cd apps/portfolio
              echo "🚀 Deploying Portfolio application..."
              wrangler deploy
              echo "✅ Portfolio deployed"
            fi
          else
            echo "⏭️ Skipping Portfolio deploy (Target: $TARGET)"
          fi
