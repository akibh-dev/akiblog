# For more details, see docs/blog/implementation-notes.md#github-workflows-blog-deploy-yml-note-1.

name: Deploy Blog (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/blog/**"
      - ".github/workflows/blog-deploy.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [notes-updated]

concurrency:
  group: blog-deploy
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # dispatch portfolio-deploy.yml after a blog deploy

jobs:
  deploy:
    name: Build & deploy blog
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: akiblog

    steps:
      - name: Checkout akiblog
        uses: actions/checkout@v5

      - name: Checkout notes (post content)
        uses: actions/checkout@v5
        with:
          repository: akibh-dev/notes
          path: .notes
          token: ${{ secrets.NOTES_TOKEN || github.token }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # the version pinned in package.json "packageManager" (bun@1.4.3),
          # so CI reads bun.lock with the same bun that wrote it
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync notes → content collection
        working-directory: apps/blog
        env:
          NOTES_DIR: ../../.notes
        run: bun scripts/sync-content.ts --require

      - name: Build blog (schema check + astro build + pagefind)
        working-directory: apps/blog
        run: bunx astro build && bunx pagefind --site dist

      - name: Ensure Pages project exists
        working-directory: apps/blog
        run: |
          if bunx wrangler pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Pages project '$PROJECT_NAME' exists"
          else
            bunx wrangler pages project create "$PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: apps/blog
        run: |
          NOTES_SHA=$(git -C ../../.notes rev-parse --short HEAD)
          bunx wrangler pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="blog@${GITHUB_SHA::7} · notes@${NOTES_SHA} · $(git log -1 --pretty=%s | head -c 150)"

      - name: Refresh the portfolio's Writings (re-run portfolio deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run portfolio-deploy.yml --ref main -R "${{ github.repository }}"
