name: Deploy Blog to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloudflare (Pages & D1)
    runs-on: alpine
    container:
      image: node:22-alpine

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm & Wrangler
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --filter blog add -D wrangler@4.131.1

      - name: Apply Remote D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/blog
          pnpm exec wrangler d1 execute blog-db --remote --file=../../packages/db/migrations/0000_initial.sql

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/blog
          pnpm exec wrangler pages deploy dist/server --project-name=blog --commit-dirty=true
