# ==============================================================================
# Cloudflare Multi-Target Production Deployment Workflow
#
# Documentation & Implementation POC:
# - Purpose: Edge deployment for the Akiblog blog (SSR Worker).
#   The portfolio deploys separately to Cloudflare Pages from GitHub Actions
#   (.github/workflows/portfolio-deploy.yml, on push to main).
# - Trigger: manual only — 'workflow_dispatch' (Run workflow button) allows targeted redeployment (all or blog)
#        and optional skipping of D1 database migrations via UI toggle.
# - Performance & Reliability:
#     - Designed for Alpine Linux runners (1GB RAM) using pre-packaged dist.tar.gz archives.
#     - Completely avoids runner OOM crashes by bypassing Node compilation on CI.
#     - Applies idempotent D1 schema migrations before activating edge Worker routes.
# ==============================================================================

name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (all, blog)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - blog
      apply_migrations:
        description: 'Apply pending D1 migrations (blog)'
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    name: Deploy Edge Applications
    runs-on: alpine-latest
    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cloudflare Wrangler
        run: |
          npm install -g wrangler@4.131.1

      # ------------------------------------------------------------------------
      # BLOG DEPLOYMENT
      # ------------------------------------------------------------------------
      - name: Extract Blog Artifacts
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "blog" ]; then
            cd apps/blog
            if [ -f "dist.tar.gz" ]; then
              tar -xzf dist.tar.gz
              echo "✅ Extracted apps/blog/dist.tar.gz"
            else
              echo "⚠️ apps/blog/dist.tar.gz not found, relying on existing dist/"
            fi
          else
            echo "⏭️ Skipping Blog artifact extraction (Target: $TARGET)"
          fi

      - name: Configure Blog Environment Variables
        env:
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "blog" ]; then
            cd apps/blog
            # Inject D1 Database ID into both config files
            if [ -n "$CLOUDFLARE_DATABASE_ID" ]; then
              sed -i "s/blog-db-local-id/$CLOUDFLARE_DATABASE_ID/g" wrangler.jsonc
              if [ -f "dist/server/wrangler.json" ]; then
                sed -i "s/blog-db-local-id/$CLOUDFLARE_DATABASE_ID/g" dist/server/wrangler.json
              fi
              echo "✅ Injected CLOUDFLARE_DATABASE_ID"
            fi
          fi

      - name: Apply Pending Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          APPLY_MIG="${{ inputs.apply_migrations }}"
          [ -z "$APPLY_MIG" ] && APPLY_MIG="true"

          if ([ "$TARGET" = "all" ] || [ "$TARGET" = "blog" ]) && [ "$APPLY_MIG" != "false" ]; then
            cd apps/blog
            echo "🚀 Applying pending migrations to blog-db..."
            for migration in ../../packages/db/migrations/*.sql; do
              if [ -f "$migration" ]; then
                echo "Applying migration: $migration"
                wrangler d1 execute blog-db --remote --file="$migration"
              fi
            done
            echo "✅ All database migrations applied"
          else
            echo "⏭️ Skipping database migrations (Target: $TARGET, Apply: $APPLY_MIG)"
          fi

      - name: Deploy Blog Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET="${{ inputs.target }}"
          [ -z "$TARGET" ] && TARGET="all"
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "blog" ]; then
            cd apps/blog
            CONFIG="dist/server/wrangler.json"
            # The Astro adapter generates this config from wrangler.jsonc at build time. It is the
            # only config with correct relative paths (main=entry.mjs, assets=../client), the
            # adapter-added SESSION KV binding, and no_bundle=true for the prebuilt chunks.
            if [ ! -f "$CONFIG" ]; then
              echo "❌ $CONFIG missing — rebuild with 'pnpm ship' and commit dist.tar.gz"; exit 1
            fi
            # Safety rails: never ship the local auth bypass or an un-injected D1 id.
            if grep -q '"DEV_MODE":"true"' "$CONFIG"; then
              echo "❌ DEV_MODE=true in $CONFIG — refusing to deploy an auth-bypassed Worker"; exit 1
            fi
            if grep -q 'blog-db-local-id' "$CONFIG"; then
              echo "❌ D1 database_id placeholder still present — set the CLOUDFLARE_DATABASE_ID secret"; exit 1
            fi
            echo "🚀 Deploying Blog SSR Worker..."
            wrangler deploy --config "$CONFIG"
            echo "✅ Blog SSR Worker deployed"
          else
            echo "⏭️ Skipping Blog deploy (Target: $TARGET)"
          fi
