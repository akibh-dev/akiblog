name: Deploy Blog Worker to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloudflare Worker
    runs-on: alpine-latest
    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: |
          npm install -g wrangler@4.131.1

      - name: Extract Build Artifacts
        run: |
          cd apps/blog
          if [ -f "dist.tar.gz" ]; then
            tar -xzf dist.tar.gz
            echo "Successfully extracted dist.tar.gz"
          fi

      - name: Configure D1 Database ID
        env:
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          cd apps/blog
          if [ -n "$CLOUDFLARE_DATABASE_ID" ]; then
            sed -i "s/blog-db-local-id/$CLOUDFLARE_DATABASE_ID/g" wrangler.toml
            if [ -f "dist/server/wrangler.json" ]; then
              sed -i "s/blog-db-local-id/$CLOUDFLARE_DATABASE_ID/g" dist/server/wrangler.json
            fi
          fi

      - name: Apply Pending Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/blog
          # Sequentially execute all migration SQL files in alphabetical order
          for migration in ../../packages/db/migrations/*.sql; do
            if [ -f "$migration" ]; then
              echo "Applying migration: $migration"
              wrangler d1 execute blog-db --remote --file="$migration"
            fi
          done

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/blog
          wrangler deploy --config dist/server/wrangler.json
