name = 'blog'
main = "dist/_worker.js"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"

# Environment variables
[vars]
SITE_URL = "https://blog.akib35.me"
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAACMqP-_QKElZMAeg"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "portfolio-forms"
database_id = "1e180c4a-9eab-4bbd-b4e9-aaa625e7d5fd"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1